<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Black-Ink Test Gallery</title><link rel="stylesheet" href="styles.css">
<style>
body{background:#f5f1e8;color:#17130f}.test-shell{max-width:1600px;margin:auto;padding:24px}.test-head{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.monster-group{margin:28px 0;padding:18px;background:#fff;border:1px solid #cfc7b7;border-radius:14px}.candidate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.candidate-card{border:1px solid #d8d0c0;border-radius:12px;padding:12px;background:#faf8f2}.candidate-card.selected{outline:4px solid #17130f}.candidate-card img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff}.meta{font-size:.85rem;opacity:.75}.pick{width:100%;margin-top:8px;padding:10px;font-weight:700}.status{margin-top:10px}
</style></head>
<body><main class="test-shell">
<header class="test-head"><div><p class="eyebrow">Engine Calibration</p><h1>Multi-Candidate Test Gallery</h1><p>Compare repeated generations, choose the strongest candidate, and use failures to improve the universal engine.</p></div><a href="/">Back to Studio</a></header>
<div id="summary" class="status">Loading…</div><div id="gallery"></div>
</main><script src="test-gallery.js"></script></body></html>
