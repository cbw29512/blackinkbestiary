<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Black-Ink Bestiary Studio</title>
  <meta name="theme-color" content="#18130f">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Production Studio</p>
        <h1>Black-Ink Bestiary</h1>
        <p class="tagline">Fantasy Monsters in Their Natural Habitat</p>
      </div>
      <div id="progress" class="progress-card" aria-live="polite"></div>
    </header>
    <section class="workspace">
      <aside class="queue-panel" aria-label="Tome page order">
        <div class="panel-head"><p id="bookId" class="eyebrow">Active Book</p><h2 id="bookTitle">Loading...</h2></div>
        <div id="queue" class="queue"></div>
      </aside>
      <section class="art-panel">
        <div id="pageHeader" class="page-head"></div>
        <div class="art-frame" id="artFrame"></div>
      </section>
      <aside class="review-sidebar" aria-label="Page review controls">
        <div class="decision-card">
          <div id="statusLine" class="status-line"></div>
          <label for="notes"><strong>Fix this page</strong></label>
          <textarea id="notes" rows="3" placeholder="Describe only what needs to change."></textarea>
          <div class="quick-tags" id="quickTags">
            <button type="button" data-tag="more white space">More white space</button>
            <button type="button" data-tag="less detail">Less detail</button>
            <button type="button" data-tag="simpler background">Simpler background</button>
            <button type="button" data-tag="clearer anatomy">Clearer anatomy</button>
            <button type="button" data-tag="stronger monster identity">Stronger identity</button>
            <button type="button" data-tag="wrong monster identity">Wrong monster</button>
            <button type="button" data-tag="stronger outer contour">Stronger outline</button>
            <button type="button" data-tag="lighter interior lines">Lighter lines</button>
            <button type="button" data-tag="story beat unclear">Story unclear</button>
            <button type="button" data-tag="required prop missing">Missing prop</button>
            <button type="button" data-tag="pose too stiff">Pose stiff</button>
            <button type="button" data-tag="focal subject weak">Weak focus</button>
            <button type="button" data-tag="environment identity weak">Weak environment</button>
            <button type="button" data-tag="environment generic">Generic environment</button>
            <button type="button" data-tag="environment story disconnect">Environment/story disconnect</button>
            <button type="button" data-tag="environment cluttered">Environment cluttered</button>
            <button type="button" data-tag="modern setting drift">Modern setting drift</button>
            <button type="button" data-tag="wrong environment">Wrong environment</button>
            <button type="button" data-tag="composition wrong">Composition wrong</button>
          </div>
          <div class="actions">
            <button id="approve" class="approve" type="button">Approve & Lock</button>
            <button id="modify" class="modify" type="button">Modify</button>
            <button id="regenerate" class="regenerate" type="button">Regenerate</button>
            <button id="generate" class="generate" type="button">Generate</button>
          </div>
          <p class="rule">Approve only when the page is final.</p>
        </div>
        <details class="audit-section" open>
          <summary>Monster identity audit</summary>
          <div class="reference-card" id="referencePanel"></div>
        </details>
        <details class="audit-section">
          <summary>Page requirements</summary>
          <div class="brief-card" id="brief"></div>
        </details>
      </aside>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
