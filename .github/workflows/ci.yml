name: Studio checks

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON and run state-machine tests
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          {
          python -m json.tool data/tome-I.json > /dev/null
          python -m json.tool data/production-state.json > /dev/null
          python -m json.tool config/studio.json > /dev/null
          python -m json.tool config/quality_rules.json > /dev/null
          python -m json.tool config/page_archetypes.json > /dev/null
          python -m json.tool config/environment_standard.json > /dev/null
          python -m json.tool config/coloring_page_standard.json > /dev/null
          python -m json.tool config/universal_page_contract.json > /dev/null
          python -m json.tool config/universal_monster_contract.json > /dev/null
          python -m json.tool config/universal_environment_contract.json > /dev/null
          python -m json.tool config/universal_story_contract.json > /dev/null
          python -m json.tool config/golden_five_calibration.json > /dev/null
          python -m json.tool data/golden-five-state.json > /dev/null
          python -m json.tool config/kdp_print_standard.json > /dev/null
          python -m json.tool config/content_scope.json > /dev/null
          python -m json.tool data/monster_source_registry.json > /dev/null
          python -m json.tool data/environment_variation_families.json > /dev/null
          python -m json.tool data/environment_overlays.json > /dev/null
          python -m json.tool data/environment_spatial_envelopes.json > /dev/null
          for file in data/environment_components/*.json; do python -m json.tool "$file" > /dev/null; done
          python -m json.tool data/series.json > /dev/null
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'art_pipeline')
          from catalog_audit import audit_monster_catalog
          report = audit_monster_catalog(Path('.').resolve())
          print('CATALOG_ERRORS=', report['errors'])
          print('OWNERSHIP_WARNINGS=', report['ownership_warnings'])
          raise SystemExit(0 if report['pass'] else 1)
          PY
          python -m unittest discover -s tests -v
          python scripts/audit_active_book.py
          python scripts/audit_series.py
          python -m compileall -q art_pipeline scripts server.py
          node --check web/app.js
          node --check web/golden-five-view.js
          node --check web/golden-five.js
          node --check web/test-gallery.js
          } 2>&1 | tee ci-output.txt
      - name: Upload CI diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output
          path: ci-output.txt
          if-no-files-found: warn
      - name: Surface CI diagnostic tail
        if: always()
        shell: bash
        run: |
          echo '## CI diagnostic tail' >> "$GITHUB_STEP_SUMMARY"
          if [ -f ci-output.txt ]; then
            tail -n 120 ci-output.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ci-output.txt was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish compact CI diagnostic branch
        if: steps.validate.outcome == 'failure' && github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          text = Path('ci-output.txt').read_text(encoding='utf-8', errors='replace') if Path('ci-output.txt').exists() else ''
          lines = text.splitlines()
          failure = next((line.strip() for line in lines if re.search(r'^(FAIL:|ERROR:)|AssertionError|FAILED \(', line.strip())), 'CI checks failed; see tail')
          payload = {
              'head_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'first_failure': failure,
              'tail': lines[-120:],
          }
          Path('/tmp/ci-diagnostic.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'blackink-ci'
          git config user.email 'blackink-ci@users.noreply.github.com'
          git checkout --orphan ci-diagnostics-tmp
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/ci-diagnostic.json ci-diagnostic.json
          git add ci-diagnostic.json
          git commit -m "CI diagnostic $GITHUB_SHA"
          git push --force origin HEAD:refs/heads/ci-diagnostics
      - name: Preserve CI failure status
        if: steps.validate.outcome == 'failure'
        run: exit 1
