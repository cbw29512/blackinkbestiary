name: Studio checks

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON and run state-machine tests
        run: |
          python -m json.tool data/tome-I.json > /dev/null
          python -m json.tool data/production-state.json > /dev/null
          python -m json.tool config/studio.json > /dev/null
          python -m json.tool config/quality_rules.json > /dev/null
          python -m json.tool config/page_archetypes.json > /dev/null
          python -m json.tool config/environment_standard.json > /dev/null
          python -m json.tool config/coloring_page_standard.json > /dev/null
          python -m json.tool config/universal_page_contract.json > /dev/null
          python -m json.tool config/universal_monster_contract.json > /dev/null
          python -m json.tool config/universal_environment_contract.json > /dev/null
          python -m json.tool config/universal_story_contract.json > /dev/null
          python -m json.tool config/golden_five_calibration.json > /dev/null
          python -m json.tool data/golden-five-state.json > /dev/null
          python -m json.tool config/kdp_print_standard.json > /dev/null
          python -m json.tool config/content_scope.json > /dev/null
          python -m json.tool data/monster_source_registry.json > /dev/null
          python -m json.tool data/environment_variation_families.json > /dev/null
          python -m json.tool data/environment_overlays.json > /dev/null
          for file in data/environment_components/*.json; do python -m json.tool "$file" > /dev/null; done
          python -m json.tool data/series.json > /dev/null
          python -m unittest discover -s tests -v
          python scripts/audit_active_book.py
          python scripts/audit_series.py
          python -m compileall -q art_pipeline scripts server.py
          node --check web/app.js
          node --check web/golden-five-view.js
          node --check web/golden-five.js
